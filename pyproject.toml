[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hems-synth"
version = "0.1.0"
description = "Synthetic HEMS household generator, device-style exports, reference loader and energy marts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Avinash Nagarajan" }]
dependencies = [
  "numpy",
  "pandas",
  "pyarrow",
  "duckdb",
  "pyyaml",
  "fastapi",
  "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "build", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
